name: Android Build & Test

on:
  push:
    branches:
      - "feat/SEAT-*"
      - dev
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API Base URL (mặc định emulator; đổi sang http://<LAN_IP>:8000/api/v1/ nếu muốn build sẵn cho điện thoại)"
        required: false
        default: "http://10.0.2.2:8000/api/v1/"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Accept Android SDK licenses and prepare Gradle
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          chmod +x gradlew
          rm -rf .gradle

      - name: Run unit tests and build debug APK
        env:
          SEATSENSE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:8000/api/v1/' }}
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee gradle.log; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seatsense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
