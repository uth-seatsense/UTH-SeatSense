# Test nhanh trên host:
# 1. Vào thư mục CV
# 2. Chọn Python
# 3. Chạy clip theo cấu hình bên dưới: & $py -m app.counting --source sample
# 4. Đọc dòng cuối “Total IN=… OUT=…” và so với đếm tay của clip: IN=0, OUT=0.
# 5. Muốn xem trên web: & $py -m uvicorn main:app --host 127.0.0.1 --port 8001
#    Nếu host đã chạy, mở thẳng http://127.0.0.1:8001 rồi chọn Uploaded File và clip ở sources.sample.
#    Bật Đếm IN/OUT, chọn Phải → trái cho vạch hiện tại, bấm Start Test rồi đọc hai ô IN và OUT.
sources:
  sample: outputs/c3056f66-938a-4ab9-abb3-3b7a0d12598d/annotated.mp4
  webcam: 0  # Webcam mặc định của máy chạy CV.
  # CS1: chờ nguồn RTSP và hiệu chỉnh đường theo góc camera thực tế
  # CS3: chờ nguồn RTSP và hiệu chỉnh đường theo góc camera thực tế

confidence: 0.32
image_size: 416
target_fps: 5
# Tọa độ chuẩn hóa của vạch trong clip mẫu. Với webcam, chỉnh theo cửa.
line:
  start: [0.5, 0.0]
  end: [0.5, 1.0]
  in_direction: negative-to-positive
  deadband: 0.01
  cooldown_ms: 500
  max_gap_ms: 1000
