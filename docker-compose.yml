services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatsense}
      POSTGRES_USER: ${POSTGRES_USER:-seatsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - seatsense_network

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-seatsense}
      DATABASE_USER: ${POSTGRES_USER:-seatsense}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CV_SERVICE_URL: http://cv:8001
      CV_INGEST_API_KEY: ${CV_INGEST_API_KEY:-${CV_API_KEY:-}}
      OCCUPANCY_CROWDED_THRESHOLD: ${OCCUPANCY_CROWDED_THRESHOLD:-0.8}
      OCCUPANCY_STALE_SECONDS: ${OCCUPANCY_STALE_SECONDS:-30}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-90}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      BOOKING_MIN_DURATION_MINUTES: ${BOOKING_MIN_DURATION_MINUTES:-30}
      BOOKING_MAX_DURATION_MINUTES: ${BOOKING_MAX_DURATION_MINUTES:-120}
      BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-7}
      BOOKING_MAX_PER_DAY: ${BOOKING_MAX_PER_DAY:-1}
      BOOKING_GAP_MINUTES: ${BOOKING_GAP_MINUTES:-15}
      BOOKING_CANCEL_CUTOFF_MINUTES: ${BOOKING_CANCEL_CUTOFF_MINUTES:-30}
      CHECKIN_GRACE_MINUTES: ${CHECKIN_GRACE_MINUTES:-15}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      cv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seatsense_network

  cv:
    build: ./cv
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      CV_API_KEY: ${CV_API_KEY:-}
    volumes:
      - ./cv/models:/app/models:ro
    ports:
      - "${CV_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seatsense_network

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_BACKEND_PROXY_TARGET: ${VITE_BACKEND_PROXY_TARGET:-http://backend:8000}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
      VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - seatsense_network

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seatsense_network

volumes:
  postgres_data:

networks:
  seatsense_network:
    driver: bridge
